<script>
const svgNS = "http://www.w3.org/2000/svg";
const keyboard = document.getElementById("keyboard-keys");

/*
    PHYSICALLY ACCURATE KEYBOARD PERSPECTIVE ENGINE
    ------------------------------------------------
    Camera Vanishing Point: (VP_X, VP_Y) = (667, 160)
    Keyboard depth plane: v from 0.0 (rear) to 1.0 (front)
    All keys, caps, and extrusion share this EXACT geometry.
*/

const VP_X = 667;
const VP_Y = 160;

const Y_BACK = 512;
const Y_FRONT = 673;

const S_BACK = 1.0;
const S_FRONT = 1.54;

const TOTAL_UNITS = 23.4;
const U_CENTER = TOTAL_UNITS / 2; // 11.7
const BASE_UNIT_PX = 33.6;

function getScale(v) {
    return 1.0 / ((1.0 - v) / S_BACK + v / S_FRONT);
}

function projectY(v) {
    const s = getScale(v);
    return Y_BACK + (Y_FRONT - Y_BACK) * ((s - S_BACK) / (S_FRONT - S_BACK));
}

function projectX(u, v) {
    const s = getScale(v);
    return VP_X + (u - U_CENTER) * BASE_UNIT_PX * s;
}

/*
    Renders an individual 3D retro keycap:
    - Side skirt (when facing camera)
    - Front face extrusion (darker side tone)
    - Top face (light off-white with stroke and subtle highlight)
*/
function createKey(u, widthUnits, v1, v2, depthPx = 4.5) {
    const keyGroup = document.createElementNS(svgNS, "g");

    // Margins inside the key cell to give clean, non-touching gaps
    const uMargin = 0.08;
    const ku1 = u + uMargin;
    const ku2 = u + widthUnits - uMargin;

    // Top face corners
    const x1_top = projectX(ku1, v1);
    const x2_top = projectX(ku2, v1);
    const y_top  = projectY(v1);

    const x1_bot = projectX(ku1, v2);
    const x2_bot = projectX(ku2, v2);
    const y_bot  = projectY(v2);

    // Front extrusion bottom corners
    const s2 = getScale(v2);
    const effectiveDepth = depthPx * s2;
    const y_ext = y_bot + effectiveDepth;

    // Side face extrusion if key is offset from camera center
    const uMid = u + widthUnits / 2;
    if (uMid < U_CENTER - 0.4) {
        // Key is on the left: right side of keycap faces camera
        const sideFace = document.createElementNS(svgNS, "path");
        sideFace.setAttribute(
            "d",
            `M ${x2_top} ${y_top}
             L ${x2_bot} ${y_bot}
             L ${x2_bot} ${y_ext}
             L ${x2_top} ${y_top + effectiveDepth * 0.75} Z`
        );
        sideFace.setAttribute("fill", "url(#keySide)");
        sideFace.setAttribute("stroke", "#282724");
        sideFace.setAttribute("stroke-width", "0.8");
        sideFace.setAttribute("stroke-linejoin", "round");
        keyGroup.appendChild(sideFace);
    } else if (uMid > U_CENTER + 0.4) {
        // Key is on the right: left side of keycap faces camera
        const sideFace = document.createElementNS(svgNS, "path");
        sideFace.setAttribute(
            "d",
            `M ${x1_top} ${y_top}
             L ${x1_bot} ${y_bot}
             L ${x1_bot} ${y_ext}
             L ${x1_top} ${y_top + effectiveDepth * 0.75} Z`
        );
        sideFace.setAttribute("fill", "url(#keySide)");
        sideFace.setAttribute("stroke", "#282724");
        sideFace.setAttribute("stroke-width", "0.8");
        sideFace.setAttribute("stroke-linejoin", "round");
        keyGroup.appendChild(sideFace);
    }

    // Front face
    const frontFace = document.createElementNS(svgNS, "path");
    frontFace.setAttribute(
        "d",
        `M ${x1_bot} ${y_bot}
         L ${x2_bot} ${y_bot}
         L ${x2_bot} ${y_ext}
         L ${x1_bot} ${y_ext} Z`
    );
    frontFace.setAttribute("fill", "url(#keySide)");
    frontFace.setAttribute("stroke", "#282724");
    frontFace.setAttribute("stroke-width", "0.9");
    frontFace.setAttribute("stroke-linejoin", "round");
    keyGroup.appendChild(frontFace);

    // Top face
    const topFace = document.createElementNS(svgNS, "path");
    topFace.setAttribute(
        "d",
        `M ${x1_top} ${y_top}
         L ${x2_top} ${y_top}
         L ${x2_bot} ${y_bot}
         L ${x1_bot} ${y_bot} Z`
    );
    topFace.setAttribute("fill", "url(#keyTop)");
    topFace.setAttribute("stroke", "#2d2c29");
    topFace.setAttribute("stroke-width", "1");
    topFace.setAttribute("stroke-linejoin", "round");
    keyGroup.appendChild(topFace);

    // Top face highlight line
    const highlight = document.createElementNS(svgNS, "line");
    highlight.setAttribute("x1", x1_top + 1);
    highlight.setAttribute("y1", y_top + 0.8);
    highlight.setAttribute("x2", x2_top - 1);
    highlight.setAttribute("y2", y_top + 0.8);
    highlight.setAttribute("stroke", "#ffffff");
    highlight.setAttribute("stroke-width", "0.8");
    highlight.setAttribute("opacity", "0.6");
    keyGroup.appendChild(highlight);

    return keyGroup;
}

/*
    KEYBOARD LAYOUT SPECIFICATION
    -----------------------------
    Matches the retro full keyboard from reference image:
    - Alpha block: 15.0 units wide
    - Nav cluster: 3.0 units wide (gap 0.6)
    - Numpad: 4.0 units wide (gap 0.6)
*/

const rowDefs = [
    // ROW 0: Function Row (Esc, F-keys, Nav top, Numpad top)
    {
        v1: 0.02,
        v2: 0.12,
        depth: 3.2,
        keys: [
            // Esc
            { u: 0, w: 1.0 },
            // F1 - F4
            { u: 1.5, w: 1.0 }, { u: 2.5, w: 1.0 }, { u: 3.5, w: 1.0 }, { u: 4.5, w: 1.0 },
            // F5 - F8
            { u: 5.9, w: 1.0 }, { u: 6.9, w: 1.0 }, { u: 7.9, w: 1.0 }, { u: 8.9, w: 1.0 },
            // F9 - F12
            { u: 10.3, w: 1.0 }, { u: 11.3, w: 1.0 }, { u: 12.3, w: 1.0 }, { u: 13.3, w: 1.0 },
            // Nav: Print / Scroll / Pause
            { u: 15.6, w: 1.0 }, { u: 16.6, w: 1.0 }, { u: 17.6, w: 1.0 },
            // Numpad: NumLock / * -
            { u: 19.2, w: 1.0 }, { u: 20.2, w: 1.0 }, { u: 21.2, w: 1.0 }, { u: 22.2, w: 1.0 }
        ]
    },

    // ROW 1: Number Row
    {
        v1: 0.18,
        v2: 0.31,
        depth: 3.8,
        keys: [
            // `~ and 1-0 - =
            { u: 0, w: 1.0 }, { u: 1.0, w: 1.0 }, { u: 2.0, w: 1.0 }, { u: 3.0, w: 1.0 }, { u: 4.0, w: 1.0 },
            { u: 5.0, w: 1.0 }, { u: 6.0, w: 1.0 }, { u: 7.0, w: 1.0 }, { u: 8.0, w: 1.0 }, { u: 9.0, w: 1.0 },
            { u: 10.0, w: 1.0 }, { u: 11.0, w: 1.0 }, { u: 12.0, w: 1.0 },
            // Backspace
            { u: 13.0, w: 2.0 },
            // Nav: Insert / Home / PgUp
            { u: 15.6, w: 1.0 }, { u: 16.6, w: 1.0 }, { u: 17.6, w: 1.0 },
            // Numpad: 7 8 9 +
            { u: 19.2, w: 1.0 }, { u: 20.2, w: 1.0 }, { u: 21.2, w: 1.0 }, { u: 22.2, w: 1.0 }
        ]
    },

    // ROW 2: QWERTY Row
    {
        v1: 0.34,
        v2: 0.47,
        depth: 4.2,
        keys: [
            // Tab
            { u: 0, w: 1.5 },
            // Q W E R T Y U I O P [ ] \
            { u: 1.5, w: 1.0 }, { u: 2.5, w: 1.0 }, { u: 3.5, w: 1.0 }, { u: 4.5, w: 1.0 }, { u: 5.5, w: 1.0 },
            { u: 6.5, w: 1.0 }, { u: 7.5, w: 1.0 }, { u: 8.5, w: 1.0 }, { u: 9.5, w: 1.0 }, { u: 10.5, w: 1.0 },
            { u: 11.5, w: 1.0 }, { u: 12.5, w: 1.0 }, { u: 13.5, w: 1.5 },
            // Nav: Delete / End / PgDn
            { u: 15.6, w: 1.0 }, { u: 16.6, w: 1.0 }, { u: 17.6, w: 1.0 },
            // Numpad: 4 5 6 +
            { u: 19.2, w: 1.0 }, { u: 20.2, w: 1.0 }, { u: 21.2, w: 1.0 }, { u: 22.2, w: 1.0 }
        ]
    },

    // ROW 3: Home Row
    {
        v1: 0.50,
        v2: 0.63,
        depth: 4.5,
        keys: [
            // Caps Lock
            { u: 0, w: 1.75 },
            // A S D F G H J K L ; '
            { u: 1.75, w: 1.0 }, { u: 2.75, w: 1.0 }, { u: 3.75, w: 1.0 }, { u: 4.75, w: 1.0 }, { u: 5.75, w: 1.0 },
            { u: 6.75, w: 1.0 }, { u: 7.75, w: 1.0 }, { u: 8.75, w: 1.0 }, { u: 9.75, w: 1.0 }, { u: 10.75, w: 1.0 },
            { u: 11.75, w: 1.0 },
            // Enter
            { u: 12.75, w: 2.25 },
            // Numpad: 1 2 3 Enter
            { u: 19.2, w: 1.0 }, { u: 20.2, w: 1.0 }, { u: 21.2, w: 1.0 }, { u: 22.2, w: 1.0 }
        ]
    },

    // ROW 4: Shift Row
    {
        v1: 0.66,
        v2: 0.80,
        depth: 4.8,
        keys: [
            // Left Shift
            { u: 0, w: 2.25 },
            // Z X C V B N M , . /
            { u: 2.25, w: 1.0 }, { u: 3.25, w: 1.0 }, { u: 4.25, w: 1.0 }, { u: 5.25, w: 1.0 }, { u: 6.25, w: 1.0 },
            { u: 7.25, w: 1.0 }, { u: 8.25, w: 1.0 }, { u: 9.25, w: 1.0 }, { u: 10.25, w: 1.0 }, { u: 11.25, w: 1.0 },
            // Right Shift
            { u: 12.25, w: 2.75 },
            // Nav: Up Arrow (centered in nav column)
            { u: 16.6, w: 1.0 },
            // Numpad: 1 2 3 Enter
            { u: 19.2, w: 1.0 }, { u: 20.2, w: 1.0 }, { u: 21.2, w: 1.0 }, { u: 22.2, w: 1.0 }
        ]
    },

    // ROW 5: Bottom / Spacebar Row
    {
        v1: 0.83,
        v2: 0.98,
        depth: 5.2,
        keys: [
            // Left modifiers
            { u: 0, w: 1.4 }, { u: 1.4, w: 1.3 }, { u: 2.7, w: 1.3 },
            // Spacebar
            { u: 4.0, w: 6.7 },
            // Right modifiers
            { u: 10.7, w: 1.3 }, { u: 12.0, w: 1.3 }, { u: 13.3, w: 1.7 },
            // Nav: Left / Down / Right
            { u: 15.6, w: 1.0 }, { u: 16.6, w: 1.0 }, { u: 17.6, w: 1.0 },
            // Numpad: 0 (wide 2u), . and Enter
            { u: 19.2, w: 2.0 }, { u: 21.2, w: 1.0 }, { u: 22.2, w: 1.0 }
        ]
    }
];

// Render all keys from back to front (preserving painter's algorithm)
rowDefs.forEach(row => {
    row.keys.forEach(k => {
        const v2 = k.v2_override !== undefined ? k.v2_override : row.v2;
        const depth = k.depth_override !== undefined ? k.depth_override : row.depth;
        const keyElement = createKey(k.u, k.w, row.v1, v2, depth);
        keyboard.appendChild(keyElement);
    });
});
